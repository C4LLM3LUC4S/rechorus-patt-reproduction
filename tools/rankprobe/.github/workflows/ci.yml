name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Locate package
        id: package
        run: |
          for candidate in . tools/rankprobe; do
            if [ -f "$candidate/pyproject.toml" ] && [ -d "$candidate/src/rankprobe" ]; then
              echo "root=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "RankProbe package was not found"
          exit 1
      - name: Install development dependencies
        working-directory: ${{ steps.package.outputs.root }}
        run: python -m pip install -e ".[dev,adapters]"
      - name: Tests
        working-directory: ${{ steps.package.outputs.root }}
        run: python -m pytest
      - name: Python lint
        working-directory: ${{ steps.package.outputs.root }}
        run: python -m ruff check .
      - name: Build wheel and source distribution
        working-directory: ${{ steps.package.outputs.root }}
        run: python -m build
      - name: Check distribution integrity and example coverage
        working-directory: ${{ steps.package.outputs.root }}
        run: python scripts/check_distribution.py
      - name: Exercise command line
        working-directory: ${{ steps.package.outputs.root }}
        run: python -m rankprobe demo --out reports/ci-demo
