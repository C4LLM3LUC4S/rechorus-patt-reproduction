[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rankprobe"
version = "0.1.0a4"
description = "Evidence-based diagnostics for recommendation and retrieval evaluation protocols"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Borui Ma"}]
keywords = ["ranking", "retrieval", "recommendation", "evaluation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/C4LLM3LUC4S/rechorus-patt-reproduction/tree/main/tools/rankprobe"
Documentation = "https://github.com/C4LLM3LUC4S/rechorus-patt-reproduction/blob/main/tools/rankprobe/docs/try-it.md"
Source = "https://github.com/C4LLM3LUC4S/rechorus-patt-reproduction/tree/main/tools/rankprobe"
Issues = "https://github.com/C4LLM3LUC4S/rechorus-patt-reproduction/issues"
Releases = "https://github.com/C4LLM3LUC4S/rechorus-patt-reproduction/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "numpy>=1.24"]
adapters = ["numpy>=1.24"]

[project.scripts]
rankprobe = "rankprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
